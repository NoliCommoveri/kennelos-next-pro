<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="stylesheet" href="../assets/forest.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1d4a33" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#173a28" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
</head>
<body class="has-shell">
  <!-- Search (UI Redesign plan Phase 2): the prototype's S.search. One box over every record,
       screen, setting and report; data/searchIndex.js lists them and ./search.js draws them. -->
  <div class="app" id="app"><div class="shell">
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div class="main">
      <header class="appbar" id="appbar"></header>
      <div class="screen forest" id="screen" tabindex="-1" data-shell-title="Search">
        <div id="app-nav" hidden></div>
        <div class="fbar"><div class="fbar-top"><label class="big-search"><span id="search-icon"></span><input id="q-search" type="search" placeholder="Search dogs, families, litters, money, settings…" autocomplete="off" aria-label="Search everything"></label></div></div>
      </div>
    </div>
  </div></div>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./search.js"></script>
</body>
</html>
