<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Business — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="stylesheet" href="../assets/forest.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1d4a33" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#173a28" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
</head>
<body class="has-shell">
  <!-- The forest look (UI Redesign plan Phase 1): the prototype's S.business. The rows come from
       data/shellNav.js and are drawn by ./business.js. -->
  <div class="app" id="app"><div class="shell">
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div class="main">
      <header class="appbar" id="appbar"></header>
      <div class="screen forest" id="screen" tabindex="-1" data-shell-title="Business" data-shell-icon="briefcase">
        <div id="app-nav" hidden></div>
      </div>
    </div>
  </div></div>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./business.js"></script>
</body>
</html>
