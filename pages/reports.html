<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="stylesheet" href="../assets/forest-shell.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1d4a33" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#173a28" media="(prefers-color-scheme: dark)">

<body class="has-shell">
  <div class="app" id="app"><div class="shell">
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div class="main">
      <header class="appbar" id="appbar"></header>
      <div class="screen legacy" id="screen" tabindex="-1">
    <div id="app-nav" hidden></div>
  <main>
    <div class="page-header">
      <div>
        <h1>Reports</h1>
        <p class="page-subtitle">Derived views over your records, grouped by what they're about. Every report reads live data, charts what you filter to, prints (or saves as PDF), and exports its rows to CSV.</p>
      </div>
    </div>
    <div id="reports-featured"></div>
    <div class="seg-tabs" id="reports-tabs" role="tablist"></div>
    <div class="grid-links" id="reports-tiles"></div>
  </main>
      </div>
    </div>
  </div></div>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./reports.js"></script>
