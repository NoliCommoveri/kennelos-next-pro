<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="stylesheet" href="../assets/forest-shell.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1d4a33" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#173a28" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
</head>
<body class="has-shell">
  <div class="app" id="app"><div class="shell">
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div class="main">
      <!-- Home's band carries the brand and the kennel line; drawn here so it's its full
           height from the first paint (nav.js draws it again with the edition and kennel). -->
      <header class="appbar" id="appbar"><div class="brand"><div class="brand-name">KennelOS</div><span class="kennel-switch" style="visibility:hidden"><span class="ks-name">&nbsp;</span></span></div></header>
      <div class="screen legacy keep-title" id="screen" tabindex="-1">
    <div id="app-nav" hidden></div>
  <main>
    <div class="page-header">
      <div>
        <h1>Today</h1>
        <p class="page-subtitle">What needs you first — reminders and what's due — up top; your kennel at a glance at the bottom.</p>
      </div>
      <a class="btn" href="calendar.html">📅 Calendar</a>
    </div>

    <div id="page-error"></div>
    <!-- Cloud backup nudge (Cloud Phase 1 plan §2.1): only when this edition has a server. -->
    <section id="today-cloud"></section>
    <!-- Website changes not sent yet (Pro with a linked KennelPort website). -->
    <section id="today-website" hidden></section>
    <section id="today-install"></section>
    <!-- Shown by today.js once the cards above are drawn, and removed in the frame
         the cards below paint together, so no card is pushed down by another. -->
    <div class="card empty-state" id="today-loading" hidden>Loading…</div>
    <section id="today-nudges"></section>
    <section id="today-reminders"></section>
    <section id="today-available"></section>
    <!-- Upcoming shows (Show Tracking Spec §5.3, Pro-only; empty in Lite) -->
    <section id="today-shows"></section>
    <section id="today-upcoming"></section>
    <section id="today-board"></section>
    <section id="today-overview"></section>
  </main>

  <!-- Lite-only: outbound links to the Demo and Pro editions. Stays empty in
       Pro/Demo (hasEditionLinks() false). -->
  <footer id="today-editions" class="edition-footer"></footer>
      </div>
    </div>
  </div></div>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./today.js"></script>
</body>
</html>
