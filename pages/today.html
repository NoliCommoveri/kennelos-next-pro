<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today — KennelOS</title>
  <link rel="stylesheet" href="../assets/app.css">
  <link rel="stylesheet" href="../assets/forest.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1d4a33" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#173a28" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KennelOS">
</head>
<body class="has-shell">
  <div class="app" id="app"><div class="shell">
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    <div class="main">
      <!-- Home's band carries the brand and the kennel line; drawn here so it's its full
           height from the first paint (nav.js draws it again with the edition and kennel). -->
      <header class="appbar" id="appbar"><div class="brand"><div class="brand-name">KennelOS</div><span class="kennel-switch" style="visibility:hidden"><span class="ks-name">&nbsp;</span></span></div></header>
      <!-- Home in the forest look (UI Redesign plan Phase 2, the prototype's S.home): Today and
           the stage pills (D28), the six tiles, Needs you (live's nudges, the owner's
           departure), This week, Coming up, and the cloud backup line. Drawn by ./today.js
           in one paint once her records are read. -->
      <div class="screen forest" id="screen" tabindex="-1" data-shell-title="Home" data-shell-icon="house">
        <div id="app-nav" hidden></div>
        <div id="page-error" hidden></div>
        <div class="today-h"><h2>Today</h2><span id="today-date">&nbsp;</span></div>
      </div>
    </div>
  </div></div>

  <script type="module" src="../app.js"></script>
  <script type="module" src="./today.js"></script>
</body>
</html>
